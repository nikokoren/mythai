name: Daily TRMNL Refresh

on:
  schedule:
    # 23:05 UTC = 00:05 MEZ im Winter, 01:05 MESZ im Sommer. Damit laeuft der
    # Lauf ganzjaehrig kurz NACH lokaler Mitternacht und traegt schon das neue
    # lokale Datum. Das ist der Zeitpunkt, zu dem das Display wechselt: TRMNL
    # erzeugt einen Screen nur neu, wenn sich die Nutzdaten geaendert haben.
    # (Vorher '0 * * * *' - stuendlich, trotz des Kommentars "Midnight UTC".)
    - cron: '5 23 * * *'

    # Und einmal kurz nach lokal 12 Uhr: da nimmt die Vollansicht Deutsch dazu.
    # Auch das ist eine Aenderung der Nutzdaten und braucht darum einen Lauf -
    # die Vorlage kann die Stunde ausrechnen so oft sie will, gezeichnet wird
    # nur, wenn sich die Datei geaendert hat.
    #
    # Zwei Eintraege, weil keine feste UTC-Stunde in beiden Halbjahren 12 Uhr
    # trifft: 10:05 UTC ist 12:05 MESZ, aber erst 11:05 MEZ. Den falschen
    # laesst refresh.py auflaufen - es rechnet show_german aus der echten
    # lokalen Zeit, findet nichts geaendert und committet nicht. So steht die
    # Umschaltung ganzjaehrig auf 12:05 lokal, bei einem Rendering pro Haelfte.
    - cron: '5 10 * * *'
    - cron: '5 11 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python3 scripts/test_selection.py

      - name: Auswahl des Tages schreiben
        # Dieselbe Zone wie der Cron oben, sonst traegt daily.date das
        # UTC-Datum statt des lokalen.
        env:
          TRMNL_TZ: Europe/Vienna
        run: python3 scripts/refresh.py

      - name: Commit und Push
        run: |
          git config user.name "TRMNL Bot"
          git config user.email "actions@github.com"
          git add words.json trmnl.json
          git diff --staged --quiet && echo "keine Aenderung" || \
            (git commit -m "Tagesauswahl $(date -u +%F)" && git push)
