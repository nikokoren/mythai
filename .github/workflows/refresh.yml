name: Daily TRMNL Refresh

on:
  schedule:
    # 00:05 UTC, einmal pro Tag. (Vorher: '0 * * * *' - das war stuendlich,
    # trotz des Kommentars "Midnight UTC". Die 5 Minuten Versatz umgehen den
    # Andrang zur vollen Stunde, bei dem GitHub Actions Laeufe verzoegert.)
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python3 scripts/test_selection.py

      - name: Auswahl des Tages schreiben
        run: python3 scripts/refresh.py

      - name: Commit und Push
        run: |
          git config user.name "TRMNL Bot"
          git config user.email "actions@github.com"
          git add words.json
          git diff --staged --quiet && echo "keine Aenderung" || \
            (git commit -m "Tagesauswahl $(date -u +%F)" && git push)
